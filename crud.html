<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin oldal</title>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
      <div class="container-fluid">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Új bejegyzés</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="crud.html">Bejegyzések</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="stat.html">Statisztikák</a>
          </li>
        </ul>
      </div>
    </nav>
    <h1>Eddigi bejegyzések</h1>
    <table class="table">
      <thead>
        <th>Hangulat</th>
        <th>Leírás</th>
        <th>Idő</th>
      </thead>
      <tbody id="content">
      </tbody>
    </table>
    <h1>Új bejegyzés felvétele:</h1>
    <form id="crudForm">
      <label for="crudMood" class="form-label">Hangulat</label>
      <select name="mood" id="crudMood" class="form-select">
        <option value="😀">😀</option>
        <option value="😐">😐</option>
        <option value="😢">😢</option>
        <option value="😴">😴</option>
        <option value="😡">😡</option>
      </select>
      <br />
      <label for="crudDesc" class="form-label">Leírás</label>
      <input type="text" name="desc" id="crudDesc" class="form-control">
      <label for="crudDate" class="form-label">Dátum és időpont</label>
      <input type="datetime-local" name="date" id="crudDate" class="form-control">
      <button type="submit" class="btn btn-info">Mentés</button>
      <p id="message"></p>
    </form>
        <script type="module" src="/src/main.ts"></script>
</body>
</html>
